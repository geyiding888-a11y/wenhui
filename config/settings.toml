# ============================================================
#  文汇 · 系统设置
#
#  这个文件是给你改的。改完保存，重新启动程序即可生效。
#  每一项上面都写了中文说明，不确定的就别动。
# ============================================================

[llm]
# 用哪个大模型。DeepSeek 当前可用的是下面这两个：
#   deepseek-flash     —— 便宜、快，汇总这种活儿完全够用（默认）
#   deepseek-v4-pro    —— 更聪明、贵 3 倍，遇到特别复杂的表格再换
#
# ⚠️ 模型名字会变，已经变过两次了：
#      deepseek-chat      —— 2026-07-24 下线
#      deepseek-v4-flash  —— 2026-09-14 发现也已改名
#    如果哪天又提示"模型不存在"，**别自己猜**：重新启动程序，
#    自检会把当前账号下可用的名字列出来，照着改这一行就行。
model = "deepseek-flash"

# 模型服务的网址。换成别家（通义/智谱/Kimi 等）时改这里。
base_url = "https://api.deepseek.com/v1"

# 让模型"严守规矩、少发挥"。汇总对齐这种活儿要的是稳定，不是创意。
temperature = 0.0

# 网络超时（秒）。表格特别多、网络特别慢时可以调大。
timeout_seconds = 60

# 调用失败重试几次。API 偶尔抽风是正常的。
max_retries = 3

# 关掉模型的"思考"（推理）开关。
# deepseek 这类会思考的模型，在思考模式下**不允许程序指定它用哪个工具**，
# 而"让模型只能从给定字段里挑、编不出字段名"这道保险正好靠这个。
# 判断"这一列是单位还是学院"用不上思考，关掉不损失准确度，还更快更省。
# ⚠️ 换成别家模型服务（通义/Kimi）时，如果它不认识这个参数而报错，改成 false。
disable_thinking = true

# 访问模型服务时**不走电脑上的代理**（Clash、VPN 这类）。
#
# ⚠️ 这一项**默认开着，别关**。
#
# 原因是一个真机上踩到的坑：你这台电脑装了 Clash，代理设置在
# HTTP_PROXY=127.0.0.1:7890，而"不走代理的名单"(NO_PROXY)里没有
# 把 deepseek 的域名排除掉。于是程序每次请求都被送进 Clash，
# Clash 再把一个**国内的** API 往国外节点上送，节点直接把连接掐了，
# 报错是：WinError 10054 远程主机强迫关闭了一个现有的连接。
#
# 现象很误导人：不是"连不上"，是"连上了又被掐断"。
# 开着这一项，程序会自己把 API 域名加进不走代理的名单，
# 不修改你的系统设置、也不动你的 Clash，只影响这个程序。
#
# 什么时候改成 false：如果你的网络**必须**通过代理才能访问外网
# （比如学校内网只放了代理这一个出口），那时关掉它。
bypass_proxy = true


[aggregate]
# 「拿不准」的判定线：AI 对某一列的判断低于这个把握，就会在界面上标黄，
# 请你亲自确认一下。标黄不是出错，是它不敢替你拍板。
#   调高 = 更谨慎，问你更多；调低 = 更省事，但可能悄悄弄错
confidence_threshold = 0.75

# 发给 AI 之前，每一列取几个样本值给它看。
# 给得多判断更准但更贵；3~5 个足够。别超过 10。
samples_per_column = 5

# 一次最多处理多少个文件（防止手滑把整个文件夹拖进来，产生意外费用）
max_files_per_run = 100

# 单次运行的费用上限（估算，单位：元）。超过就停下来提醒你。
# 设成 0 表示不限制。正常一次汇总只要几分钱。
cost_limit_cny = 5.0


[privacy]
# 发给 AI 之前自动给敏感信息打码（如 3301**********1234）。
# AI 只需要看"这串数字长得像身份证"，不需要看真实号码。
# 注意：你自己拿到的汇总表里，仍然是完整的原文。
mask_id_card = true
mask_phone = true
mask_bank_card = true
mask_email = true


[agent]
# ------------------------------------------------------------
#  智能助手（在界面上直接打一句话问数据，比如"X老师有多少学生"）
#
#  这一整段只管**问答**那一个功能，改坏了不影响汇总。
#  汇总那条流水线是固定的，一个字都不会被这里影响。
# ------------------------------------------------------------

# 要不要这个功能。改成 false，界面上那一整块会消失，其余功能照常。
enabled = true

# 一次提问最多让 AI 来回几轮（它可能要查好几次才答得上来，
# 比如先查有哪些学院、再按学院统计）。
# 上限的作用是**防转圈烧钱**：模型偶尔会陷进"查一次不满意再查一次"，
# 没有上限它就会一直试下去。给 6 已经足够问清一件事。
max_turns = 6

# 查出来的结果，最多把多少行发给 AI 看。
# 超过的部分只告诉它"一共多少行"，不把内容发出去——既省钱，也少往外发数据。
# 它要是需要精确数字（比如"一共多少人"），本来的做法就是让它自己算 SUM/COUNT，
# 所以给少一点不影响准确性。调大到 50 会更啰嗦也更贵。
result_rows_for_ai = 20

# 每一列取几个样本值给 AI 看，帮它分清这列是"数字"还是"文字"。
# 给 0 也行（只看列名它就能写查询），但给两三个会准一些。
samples_per_column = 3

# 要不要把**姓名**也打码（张三 → 张*）。
#
# 默认 false（不打码），理由：
#   "张三有多少学生"这类问题，姓名打码了就永远答不出来，
#   而这个功能的价值一大半正在这儿。
#   而且现有流程本来就会把姓名样本发给 AI（对齐列名那一步），
#   所以这里不打码并没有**新增**泄露面。
#
# 但确实有个变化要你知道：以前 AI 只看得到"列名 + 几个打码样本"，
# 现在它会看到查询结果里一行行的真实姓名。
# 介意就改成 true —— 统计类问题照样能答，只是回答里的人都变成"张*"。
# （身份证/手机号/银行卡/邮箱**无论如何都会打码**，那四个开关在 [privacy] 里）
mask_name_in_answer = false

# 问答的累计花费上限（元）。到线了就停下、不再回答，并告诉你怎么调大。0 = 不限制。
#
# 为什么问答要单独一个上限、不和汇总共用一个：
#   汇总是"点一次花一笔"，一次几毛，你心里有数；
#   问答是"打一句话花一点"，一次几分钱，但**可以问一百次**。
#   共用一个额度的话，你会问着问着突然发现汇总跑不了了，还说不清钱花在哪。
#
# 这个数是**累计**的：关掉程序再打开，之前花的仍然算数。
# 2 块钱够问几百个问题，正常用根本到不了。
cost_limit_cny = 2.0


[excel]
# 自动寻找表头时，往下扫描多少行。有些表前面几行是标题、说明、盖章位置。
header_scan_rows = 10

# 把"无 / 没有 / — / N/A / NULL"这类写法统一当成空值。
treat_as_empty = ["无", "没有", "暂无", "—", "-", "/", "N/A", "NA", "null", "NULL", "None", ""]
